name: Candidate transit wiring

on:
  push:
    branches:
      - exp/lakshmi-numerology-signal
    paths:
      - .github/workflows/candidate-transit-wiring.yml

permissions:
  contents: write

jobs:
  wire-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Nokku
        uses: actions/checkout@v4
        with:
          ref: exp/lakshmi-numerology-signal

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wire factual candidate transit receipts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nokku/lottery/kerala/living.py')
          text = path.read_text()

          replacements = []

          replacements.append((
              'from .fact_recall import KeralaFactRecallResult, recall_kerala_facts_result\n',
              'from .ephemeris import (\n'
              '    LakshmiTransitReceipt,\n'
              '    SiderealPosition,\n'
              '    lakshmi_transit_receipt,\n'
              ')\n'
              'from .fact_recall import KeralaFactRecallResult, recall_kerala_facts_result\n',
          ))

          replacements.append((
              '@dataclass(frozen=True, slots=True)\nclass LivingDecisionResult:\n',
              '@dataclass(frozen=True, slots=True)\n'
              'class CandidateTransitObservationResult:\n'
              '    """Truthful factual transit receipts at official candidate draw instants."""\n\n'
              '    status: str\n'
              '    receipts: tuple[LakshmiTransitReceipt, ...]\n'
              '    failures: tuple[str, ...] = ()\n'
              '    uncertainty: tuple[str, ...] = ()\n\n\n'
              '@dataclass(frozen=True, slots=True)\n'
              'class LivingDecisionResult:\n',
          ))

          replacements.append((
              '    astrology_observation_result: AstrologyObservationResult | None\n\n\ndef local_today',
              '    astrology_observation_result: AstrologyObservationResult | None\n'
              '    candidate_transit_observations: CandidateTransitObservationResult\n\n\ndef local_today',
          ))

          replacements.append((
              'def _numerology_signals_for_candidates(\n',
              'def _candidate_transit_observations(\n'
              '    *,\n'
              '    candidate_dates: tuple[date, ...],\n'
              '    draw_times: dict[date, str],\n'
              ') -> CandidateTransitObservationResult:\n'
              '    """Observe Moon/Jupiter at official draw instants without interpretation."""\n'
              '    candidates = tuple(sorted(set(candidate_dates)))\n'
              '    if not candidates:\n'
              '        return CandidateTransitObservationResult(\n'
              '            status="not_applicable",\n'
              '            receipts=(),\n'
              '        )\n\n'
              '    receipts: list[LakshmiTransitReceipt] = []\n'
              '    failures: list[str] = []\n'
              '    uncertainty: list[str] = []\n'
              '    for candidate in candidates:\n'
              '        draw_time = draw_times.get(candidate)\n'
              '        if draw_time is None:\n'
              '            uncertainty.append(\n'
              '                f"official draw time not available for {candidate.isoformat()}"\n'
              '            )\n'
              '            continue\n'
              '        try:\n'
              '            local_time = datetime.strptime(draw_time, "%H:%M").time()\n'
              '            target_at = datetime.combine(\n'
              '                candidate,\n'
              '                local_time,\n'
              '                tzinfo=KERALA_TIMEZONE,\n'
              '            )\n'
              '            receipts.append(lakshmi_transit_receipt(target_at=target_at))\n'
              '        except Exception as exc:  # isolate optional experimental evidence\n'
              '            failures.append(\n'
              '                f"{candidate.isoformat()}: {type(exc).__name__}: {exc}"\n'
              '            )\n\n'
              '    if failures or uncertainty:\n'
              '        status = "partial" if receipts else "unavailable"\n'
              '    else:\n'
              '        status = "success"\n'
              '    return CandidateTransitObservationResult(\n'
              '        status=status,\n'
              '        receipts=tuple(receipts),\n'
              '        failures=tuple(failures),\n'
              '        uncertainty=tuple(uncertainty),\n'
              '    )\n\n\n'
              'def _numerology_signals_for_candidates(\n',
          ))

          replacements.append((
              'def _astrology_observation_payload(\n',
              'def _sidereal_position_payload(position: SiderealPosition) -> dict[str, object]:\n'
              '    return {\n'
              '        "body": position.body,\n'
              '        "target_at": position.target_at.isoformat(),\n'
              '        "tropical_longitude_deg": position.tropical_longitude_deg,\n'
              '        "sidereal_longitude_deg": position.sidereal_longitude_deg,\n'
              '        "ayanamsa_deg": position.ayanamsa_deg,\n'
              '        "sign_index": position.sign_index,\n'
              '        "sign_name": position.sign_name,\n'
              '        "degrees_in_sign": position.degrees_in_sign,\n'
              '        "ephemeris_kernel": position.ephemeris_kernel,\n'
              '        "ayanamsa_realization": position.ayanamsa_realization,\n'
              '        "status": position.status,\n'
              '    }\n\n\n'
              'def _candidate_transit_observation_payload(\n'
              '    result: CandidateTransitObservationResult | None,\n'
              ') -> dict[str, object]:\n'
              '    if result is None:\n'
              '        return {"status": "not_requested", "receipts": []}\n'
              '    return {\n'
              '        "status": result.status,\n'
              '        "failures": list(result.failures),\n'
              '        "uncertainty": list(result.uncertainty),\n'
              '        "receipts": [\n'
              '            {\n'
              '                "target_at": receipt.target_at.isoformat(),\n'
              '                "ephemeris_kernel": receipt.ephemeris_kernel,\n'
              '                "ayanamsa_realization": receipt.ayanamsa_realization,\n'
              '                "status": receipt.status,\n'
              '                "moon": _sidereal_position_payload(receipt.moon),\n'
              '                "jupiter": _sidereal_position_payload(receipt.jupiter),\n'
              '            }\n'
              '            for receipt in result.receipts\n'
              '        ],\n'
              '    }\n\n\n'
              'def _astrology_observation_payload(\n',
          ))

          replacements.append((
              '    astrology_observation_result: AstrologyObservationResult | None = None,\n'
              '    memory_path: str | Path | None = None,\n',
              '    astrology_observation_result: AstrologyObservationResult | None = None,\n'
              '    candidate_transit_observations: CandidateTransitObservationResult | None = None,\n'
              '    memory_path: str | Path | None = None,\n',
          ))

          replacements.append((
              '                "astrology_observation_attempt": _astrology_observation_payload(\n'
              '                    astrology_observation_result\n'
              '                ),\n',
              '                "candidate_draw_transit_observations": (\n'
              '                    _candidate_transit_observation_payload(\n'
              '                        candidate_transit_observations\n'
              '                    )\n'
              '                ),\n'
              '                "astrology_observation_attempt": _astrology_observation_payload(\n'
              '                    astrology_observation_result\n'
              '                ),\n',
          ))

          replacements.append((
              '    candidate_numerology = _numerology_signals_for_candidates(\n',
              '    candidate_transit_observations = _candidate_transit_observations(\n'
              '        candidate_dates=scheduled_candidates,\n'
              '        draw_times=scheduled_draw_times,\n'
              '    )\n'
              '    candidate_numerology = _numerology_signals_for_candidates(\n',
          ))

          replacements.append((
              '        astrology_observation_result=astrology_observation_result,\n'
              '        memory_path=memory_target,\n',
              '        astrology_observation_result=astrology_observation_result,\n'
              '        candidate_transit_observations=candidate_transit_observations,\n'
              '        memory_path=memory_target,\n',
          ))

          replacements.append((
              '        astrology_observation_result=astrology_observation_result,\n'
              '    )\n',
              '        astrology_observation_result=astrology_observation_result,\n'
              '        candidate_transit_observations=candidate_transit_observations,\n'
              '    )\n',
          ))

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected living.py anchor not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          cat > tests/test_lakshmi_candidate_transits.py <<'PY'
          from datetime import date

          import pytest

          pytest.importorskip("collector")
          pytest.importorskip("cossse")

          from cossse.memory import Memory

          from nokku.lottery.kerala.living import SCHEDULE_DOMAIN, run_weekly_decision


          def _schedule_collector(domain_path, source, store=True, requester=None):
              assert domain_path == SCHEDULE_DOMAIN
              assert source == "upcoming"
              assert store is False
              assert requester == "nokku"
              return {
                  "request": {
                      "domain_path": domain_path,
                      "source": source,
                      "requester": requester,
                  },
                  "data": {
                      "parsed": {
                          "source_kind": "official_upcoming_draw_schedule",
                          "upcoming_draws": [
                              {
                                  "lottery_name": "Karunya",
                                  "draw_code": "KR-768",
                                  "draw_date": "2026-09-12",
                                  "draw_time": "15:00",
                                  "draw_venue": "LOTIS fixture",
                              }
                          ],
                      }
                  },
                  "execution": {"status": "success"},
              }


          def test_living_loop_preserves_factual_transits_at_official_draw_instant(tmp_path):
              memory_path = tmp_path / "living.sqlite"
              result = run_weekly_decision(
                  "Should I buy a Kerala lottery this week?",
                  anchor=date(2026, 9, 12),
                  week_start_override="sunday",
                  refresh=True,
                  memory_path=memory_path,
                  preferences_path=tmp_path / "preferences.json",
                  collector=_schedule_collector,
              )

              observations = result.candidate_transit_observations
              assert observations.status == "success"
              assert observations.failures == ()
              assert observations.uncertainty == ()
              assert len(observations.receipts) == 1

              receipt = observations.receipts[0]
              assert receipt.target_at.isoformat() == "2026-09-12T15:00:00+05:30"
              assert receipt.moon.sign_name == "Virgo"
              assert receipt.moon.degrees_in_sign == pytest.approx(11.15865, abs=0.001)
              assert receipt.jupiter.sign_name == "Cancer"
              assert receipt.jupiter.degrees_in_sign == pytest.approx(21.81443, abs=0.001)

              # Astronomy facts are observational only in this slice.
              assert result.decision.recommendation == "SKIP"

              with Memory(memory_path) as memory:
                  recalled = memory.recall(result.memory_id)

              stored = recalled["body"]["operational_context"][
                  "candidate_draw_transit_observations"
              ]
              assert stored["status"] == "success"
              assert stored["failures"] == []
              assert stored["uncertainty"] == []
              assert len(stored["receipts"]) == 1
              stored_receipt = stored["receipts"][0]
              assert stored_receipt["target_at"] == "2026-09-12T15:00:00+05:30"
              assert stored_receipt["moon"]["sign_name"] == "Virgo"
              assert stored_receipt["jupiter"]["sign_name"] == "Cancer"
          PY

      - name: Fresh install and regression
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          pytest -q

      - name: Commit proven wiring
        shell: bash
        run: |
          git config user.name "Sathya P B"
          git config user.email "sathya@gooleos.com"
          git add nokku/lottery/kerala/living.py tests/test_lakshmi_candidate_transits.py
          git commit -m "feat: preserve candidate draw transit receipts"
          git push origin HEAD:exp/lakshmi-numerology-signal
