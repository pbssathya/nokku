name: Collector-backed Government repair through 2026-09-05

on:
  push:
    branches:
      - fix/collector-e2bdedb-government-repair
    paths:
      - .github/workflows/collector-government-repair-2026-09-05.yml

permissions:
  contents: write

jobs:
  repair-government-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Nokku and corrected Collector
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python - <<'PY'
          import json
          import pathlib
          import collector
          direct = pathlib.Path(collector.__file__).resolve().parent.parent / "collector-1.0.0.dist-info" / "direct_url.json"
          payload = json.loads(direct.read_text())
          commit = payload.get("vcs_info", {}).get("commit_id")
          print("Collector commit:", commit)
          expected = "e2bdedbd465104c7e11824bc94fb535482aedcc6"
          if commit != expected:
              raise SystemExit(f"Unexpected Collector commit: {commit}")
          PY

      - name: Prove migration rule against freshly reparsed control draws
        run: |
          python - <<'PY'
          from copy import deepcopy
          from datetime import date, datetime
          import json
          from pathlib import Path

          from nokku.lottery.kerala.decision import KeralaLotteryFact
          from nokku.lottery.kerala.government_record_recall import recall_government_records_result
          from nokku.lottery.kerala.living import refresh_current_frontier_result

          root = Path("exports/kerala_lottery_government")
          manifest = json.loads((root / "manifest.json").read_text())

          all_records = {}
          for item in manifest["shards"]:
              shard = json.loads((root / item["file"]).read_text())
              for record in shard["records"]:
                  all_records[str(record.get("source"))] = record

          record_75362 = all_records["75362"]
          checkpoint = KeralaLotteryFact(
              source="75362",
              draw_date=datetime.strptime(record_75362["draw_date"], "%d/%m/%Y").date(),
              lottery_name=str(record_75362.get("lottery_name") or ""),
          )
          memory_path = Path("/tmp/nokku-repair-memory")
          frontier = refresh_current_frontier_result(
              anchor=date(2026, 9, 5),
              facts=(checkpoint,),
              memory_path=memory_path,
              max_new_sources=8,
          )
          expected_sources = tuple(str(v) for v in range(75363, 75371))
          print("Frontier receipt:", frontier)
          if frontier.status != "success" or frontier.refreshed_sources != expected_sources:
              raise SystemExit(f"Control reparse failed: {frontier}")

          recalled = recall_government_records_result(
              anchor=date(2026, 9, 5),
              memory_path=memory_path,
              min_numeric_source_exclusive=75362,
          )
          fresh = {str(r.get("source")): r for r in recalled.records}
          if recalled.status != "success" or tuple(fresh) != expected_sources:
              raise SystemExit(f"Unexpected control records: status={recalled.status} sources={tuple(fresh)}")

          markers = (
              "government gazette",
              "prize winners are advised",
              "surrender the winning tickets",
              "deputy director",
              "directorate of state lotteries",
              "gorky bhavan",
              "digitally signed document",
              "authenticity may be",
              "verified through",
              "veriﬁed through",
              "sd/-",
          )

          def is_footer_boundary(text: str) -> bool:
              lower = text.strip().lower()
              if any(marker in lower for marker in markers):
                  return True
              return lower.startswith("next ") and " draw will be held on" in lower

          def migrated_record(record):
              candidate = deepcopy(record)
              parsed = candidate.get("parsed") or {}
              for tier in parsed.get("prize_tiers") or []:
                  entries = list(tier.get("entries") or [])
                  cut = None
                  for index, entry in enumerate(entries):
                      if is_footer_boundary(str(entry)):
                          cut = index
                          break
                  if cut is not None:
                      tier["entries"] = entries[:cut]
              return candidate

          for source in expected_sources:
              migrated = migrated_record(all_records[source])
              if migrated != fresh[source]:
                  old_tiers = (all_records[source].get("parsed") or {}).get("prize_tiers") or []
                  migrated_tiers = (migrated.get("parsed") or {}).get("prize_tiers") or []
                  fresh_tiers = (fresh[source].get("parsed") or {}).get("prize_tiers") or []
                  print("Control mismatch source:", source)
                  print("Old tier entry counts:", [(t.get("label"), len(t.get("entries") or [])) for t in old_tiers])
                  print("Migrated tier entry counts:", [(t.get("label"), len(t.get("entries") or [])) for t in migrated_tiers])
                  print("Fresh tier entry counts:", [(t.get("label"), len(t.get("entries") or [])) for t in fresh_tiers])
                  raise SystemExit("Legacy-tail migration does not exactly reproduce corrected Collector")

          Path("/tmp/fresh_control_records.json").write_text(
              json.dumps(fresh, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("Control equivalence PASS for:", expected_sources)
          PY

      - name: Migrate historical legacy footer tails
        run: |
          python - <<'PY'
          from copy import deepcopy
          from datetime import datetime, timezone
          import json
          from pathlib import Path

          root = Path("exports/kerala_lottery_government")
          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text())
          fresh = json.loads(Path("/tmp/fresh_control_records.json").read_text())

          markers = (
              "government gazette",
              "prize winners are advised",
              "surrender the winning tickets",
              "deputy director",
              "directorate of state lotteries",
              "gorky bhavan",
              "digitally signed document",
              "authenticity may be",
              "verified through",
              "veriﬁed through",
              "sd/-",
          )

          def is_footer_boundary(text: str) -> bool:
              lower = text.strip().lower()
              if any(marker in lower for marker in markers):
                  return True
              return lower.startswith("next ") and " draw will be held on" in lower

          def migrate(record):
              candidate = deepcopy(record)
              changed = False
              removed = 0
              parsed = candidate.get("parsed") or {}
              for tier in parsed.get("prize_tiers") or []:
                  entries = list(tier.get("entries") or [])
                  for index, entry in enumerate(entries):
                      if is_footer_boundary(str(entry)):
                          removed += len(entries) - index
                          tier["entries"] = entries[:index]
                          changed = True
                          break
              return candidate, changed, removed

          before_sources = []
          before_count = 0
          updated_records = 0
          removed_entries = 0
          changed_shards = []
          now = datetime.now(timezone.utc).isoformat()

          for item in manifest["shards"]:
              path = root / item["file"]
              shard = json.loads(path.read_text())
              shard_changed = False
              migrated_records = []
              for record in shard["records"]:
                  source = str(record.get("source"))
                  before_sources.append(source)
                  before_count += 1
                  candidate, changed, removed = migrate(record)
                  if source in fresh:
                      if candidate != fresh[source]:
                          raise SystemExit(f"Stored migration drifted from fresh control for {source}")
                      candidate = fresh[source]
                  if candidate != record:
                      updated_records += 1
                      removed_entries += removed
                      shard_changed = True
                  migrated_records.append(candidate)
              if shard_changed:
                  shard["records"] = migrated_records
                  shard["generated_at"] = now
                  path.write_text(json.dumps(shard, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  changed_shards.append(item["file"])

          manifest["generated_at"] = now
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          after_sources = []
          after_count = 0
          remaining = {}
          for item in manifest["shards"]:
              shard = json.loads((root / item["file"]).read_text())
              for record in shard["records"]:
                  source = str(record.get("source"))
                  after_sources.append(source)
                  after_count += 1
                  for tier in (record.get("parsed") or {}).get("prize_tiers") or []:
                      for entry in tier.get("entries") or []:
                          if is_footer_boundary(str(entry)):
                              remaining.setdefault(source, []).append(str(entry))

          print("Migrated records:", updated_records)
          print("Removed legacy footer entries:", removed_entries)
          print("Changed shards:", len(changed_shards))
          print("Remaining contaminated records:", len(remaining))

          if before_count != 3180 or after_count != 3180:
              raise SystemExit(f"Record count changed: before={before_count} after={after_count}")
          if before_sources != after_sources:
              raise SystemExit("Source ordering/identity changed during migration")
          if str(manifest.get("latest_source")) != "75370" or manifest.get("latest_draw_date") != "2026-09-05" or int(manifest.get("record_count")) != 3180:
              raise SystemExit("Manifest frontier/count changed during migration")
          if updated_records < 3000:
              raise SystemExit(f"Unexpectedly small migration scope: {updated_records}")
          if remaining:
              raise SystemExit(f"Footer contamination remains in {len(remaining)} records")
          PY

      - name: Verify repository diff is Government export only
        run: |
          python - <<'PY'
          import subprocess
          lines = subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines()
          changed = {line[3:] for line in lines if line.strip()}
          print("Changed file count:", len(changed))
          unexpected = {
              path for path in changed
              if not path.startswith("exports/kerala_lottery_government/") or not path.endswith(".json")
          }
          if unexpected:
              raise SystemExit(f"Unexpected repository changes: {sorted(unexpected)}")
          if "exports/kerala_lottery_government/manifest.json" not in changed:
              raise SystemExit("Manifest did not receive migration receipt timestamp")
          PY

      - name: Run Nokku regression suite
        run: pytest -q

      - name: Commit verified Government corpus migration
        run: |
          git config user.name "Sathya P B"
          git config user.email "sathya@gooleos.com"
          git add exports/kerala_lottery_government
          git commit -m "data: remove legacy Kerala prize footer contamination"
          git push origin HEAD:fix/collector-e2bdedb-government-repair
