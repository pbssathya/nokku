name: Collector-backed Government repair through 2026-09-05

on:
  push:
    branches:
      - fix/collector-e2bdedb-government-repair
    paths:
      - .github/workflows/collector-government-repair-2026-09-05.yml

permissions:
  contents: write

jobs:
  repair-government-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Nokku and corrected Collector
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python - <<'PY'
          import json
          import pathlib
          import collector
          direct = pathlib.Path(collector.__file__).resolve().parent.parent / "collector-1.0.0.dist-info" / "direct_url.json"
          payload = json.loads(direct.read_text())
          commit = payload.get("vcs_info", {}).get("commit_id")
          print("Collector commit:", commit)
          expected = "e2bdedbd465104c7e11824bc94fb535482aedcc6"
          if commit != expected:
              raise SystemExit(f"Unexpected Collector commit: {commit}")
          PY

      - name: Regenerate DrawSerial 75363 through 75370 from Government evidence
        run: |
          cat > /tmp/kerala_government_export.json <<'JSON'
          {
            "runtime_export_directory": "/tmp/nokku-government-runtime",
            "repository_export_directory": "exports/kerala_lottery_government",
            "manifest_filename": "manifest.json",
            "shard_period_format": "%Y-%m",
            "shard_filename_template": "{period}.json",
            "frontier_max_new_sources": 8
          }
          JSON
          python - <<'PY'
          from datetime import date, datetime
          import json
          from pathlib import Path

          from nokku.lottery.kerala.decision import KeralaLotteryFact
          from nokku.lottery.kerala.government_record_recall import recall_government_records_result
          from nokku.lottery.kerala.living import refresh_current_frontier_result
          from tools.update_kerala_government import load_export_config, _incremental_export

          root = Path("exports/kerala_lottery_government")
          august = json.loads((root / "2026-08.json").read_text())
          record_75362 = next(r for r in august["records"] if str(r.get("source")) == "75362")
          checkpoint = KeralaLotteryFact(
              source="75362",
              draw_date=datetime.strptime(record_75362["draw_date"], "%d/%m/%Y").date(),
              lottery_name=str(record_75362.get("lottery_name") or ""),
          )
          memory_path = Path("/tmp/nokku-repair-memory")
          frontier = refresh_current_frontier_result(
              anchor=date(2026, 9, 5),
              facts=(checkpoint,),
              memory_path=memory_path,
              max_new_sources=8,
          )
          print("Frontier receipt:", frontier)
          expected_sources = tuple(str(v) for v in range(75363, 75371))
          if frontier.status != "success":
              raise SystemExit(f"Frontier repair failed: {frontier}")
          if frontier.refreshed_sources != expected_sources:
              raise SystemExit(f"Unexpected refreshed sources: {frontier.refreshed_sources}")

          recalled = recall_government_records_result(
              anchor=date(2026, 9, 5),
              memory_path=memory_path,
              min_numeric_source_exclusive=75362,
          )
          records = list(recalled.records)
          actual_sources = tuple(str(r.get("source")) for r in records)
          print("Recalled repaired sources:", actual_sources)
          if recalled.status != "success" or actual_sources != expected_sources:
              raise SystemExit(f"Unexpected repaired records: status={recalled.status} sources={actual_sources}")

          footer_markers = (
              "Government Gazette",
              "Deputy Director",
              "Directorate Of State Lotteries",
              "digitally signed document",
              "Authenticity may be",
              "Next ",
              "GORKY BHAVAN",
              "Sd/-",
          )
          for record in records:
              tiers = (record.get("parsed") or {}).get("prize_tiers") or []
              if not tiers:
                  raise SystemExit(f"No prize tiers for repaired source {record.get('source')}")
              for tier in tiers:
                  for entry in tier.get("entries") or []:
                      text = str(entry)
                      if any(marker in text for marker in footer_markers):
                          raise SystemExit(f"Footer contamination remains in {record.get('source')}: {text}")

          config = load_export_config("/tmp/kerala_government_export.json")
          manifest = json.loads((root / "manifest.json").read_text())
          final_manifest, changed_files, added, updated, manifest_changed = _incremental_export(
              config=config,
              manifest=manifest,
              anchor=date(2026, 9, 5),
              new_records=records,
          )
          print("Changed shards:", changed_files)
          print("Records added:", added)
          print("Records updated:", updated)
          print("Manifest changed:", manifest_changed)
          print("Final frontier:", final_manifest.get("latest_source"), final_manifest.get("latest_draw_date"), final_manifest.get("record_count"))
          if added != 0:
              raise SystemExit(f"Repair unexpectedly added records: {added}")
          if updated != 8:
              raise SystemExit(f"Expected 8 repaired records, got {updated}")
          if set(changed_files) != {"2026-08.json", "2026-09.json"}:
              raise SystemExit(f"Unexpected changed shards: {changed_files}")
          if str(final_manifest.get("latest_source")) != "75370" or final_manifest.get("latest_draw_date") != "2026-09-05" or int(final_manifest.get("record_count")) != 3180:
              raise SystemExit(f"Frontier changed unexpectedly: {final_manifest}")
          PY

      - name: Audit entire preserved export for remaining footer contamination
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("exports/kerala_lottery_government")
          manifest = json.loads((root / "manifest.json").read_text())
          markers = (
              "Government Gazette",
              "Deputy Director",
              "Directorate Of State Lotteries",
              "digitally signed document",
              "Authenticity may be",
              "GORKY BHAVAN",
              "Sd/-",
          )
          contaminated = {}
          for item in manifest["shards"]:
              shard = json.loads((root / item["file"]).read_text())
              for record in shard["records"]:
                  hits = []
                  for tier in (record.get("parsed") or {}).get("prize_tiers") or []:
                      for entry in tier.get("entries") or []:
                          text = str(entry)
                          if any(marker in text for marker in markers):
                              hits.append(text)
                  if hits:
                      contaminated[str(record.get("source"))] = hits
          print("Remaining contaminated record count:", len(contaminated))
          print("Remaining contaminated sources:", sorted(contaminated)[:200])
          if contaminated:
              raise SystemExit("Historical footer contamination remains; do not promote partial repair")
          PY

      - name: Verify diff scope
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              "exports/kerala_lottery_government/2026-08.json",
              "exports/kerala_lottery_government/2026-09.json",
          }
          lines = subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines()
          changed = {line[3:] for line in lines if line.strip()}
          print("Changed files:", sorted(changed))
          if changed != allowed:
              raise SystemExit(f"Unexpected repair diff: {sorted(changed)}")
          PY

      - name: Run Nokku regression suite
        run: pytest -q

      - name: Commit verified repaired Government evidence
        run: |
          git config user.name "Sathya P B"
          git config user.email "sathya@gooleos.com"
          git add exports/kerala_lottery_government/2026-08.json exports/kerala_lottery_government/2026-09.json
          git commit -m "data: regenerate Kerala Government records with corrected Collector"
          git push origin HEAD:fix/collector-e2bdedb-government-repair
