name: Lahiri conversion proof

on:
  push:
    branches:
      - exp/lakshmi-numerology-signal
    paths:
      - .github/workflows/lahiri-proof.yml
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Skyfield
        run: python -m pip install 'skyfield==1.55'

      - name: Validate Lahiri conversion at KR-768 draw instant
        shell: bash
        run: |
          python - <<'PY'
          from math import floor
          from skyfield.api import load

          J2000 = 2451545.0
          LAHIRI_J2000_DEG = 23 + 51/60 + 25.53/3600

          def general_precession_iau2006_deg(tt_jd: float) -> float:
              T = (tt_jd - J2000) / 36525.0
              arcsec = (
                  5028.796195 * T
                  + 1.1054348 * T**2
                  + 0.00007964 * T**3
                  - 0.000023857 * T**4
                  - 0.0000000383 * T**5
              )
              return arcsec / 3600.0

          def lahiri_ayanamsa_deg(tt_jd: float) -> float:
              return LAHIRI_J2000_DEG + general_precession_iau2006_deg(tt_jd)

          def sign_position(longitude: float) -> tuple[int, float]:
              value = longitude % 360.0
              sign_index = floor(value / 30.0)
              return sign_index, value - sign_index * 30.0

          ts = load.timescale()
          t = ts.utc(2026, 9, 12, 9, 30, 0)  # 15:00 IST
          eph = load('de421.bsp')
          earth = eph['earth']

          aya = lahiri_ayanamsa_deg(t.tt)
          print(f'tt_jd={t.tt:.9f}')
          print(f'lahiri_ayanamsa_deg={aya:.9f}')

          for label, body in {
              'moon': eph['moon'],
              'jupiter': eph['jupiter barycenter'],
          }.items():
              apparent = earth.at(t).observe(body).apparent()
              _, tropical_lon, _ = apparent.ecliptic_latlon(epoch='date')
              sidereal = (tropical_lon.degrees - aya) % 360.0
              sign_index, in_sign = sign_position(sidereal)
              print(f'{label}_tropical_lon_deg={tropical_lon.degrees:.9f}')
              print(f'{label}_sidereal_lon_deg={sidereal:.9f}')
              print(f'{label}_sign_index={sign_index}')
              print(f'{label}_in_sign_deg={in_sign:.9f}')

          # Virgo index = 5. Recovered Lakshmi observation: Moon ~ Virgo 11°09′.
          moon_apparent = earth.at(t).observe(eph['moon']).apparent()
          _, moon_tropical, _ = moon_apparent.ecliptic_latlon(epoch='date')
          moon_sidereal = (moon_tropical.degrees - aya) % 360.0
          moon_sign, moon_in_sign = sign_position(moon_sidereal)
          expected_deg = 11 + 9/60
          error_arcmin = abs(moon_in_sign - expected_deg) * 60.0
          print(f'moon_vs_recovered_error_arcmin={error_arcmin:.6f}')
          assert moon_sign == 5, (moon_sign, moon_in_sign)
          assert error_arcmin < 1.0, error_arcmin

          eph.close()
          PY
