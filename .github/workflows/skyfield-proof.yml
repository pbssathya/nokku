name: Skyfield proof of fit

on:
  push:
    branches:
      - exp/lakshmi-numerology-signal
    paths:
      - .github/workflows/skyfield-proof.yml
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Skyfield
        run: python -m pip install 'skyfield==1.55'

      - name: Compute Moon and Jupiter geocentric ecliptic longitudes
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from skyfield.api import load

          # 12 Sep 2026 15:00 IST == 09:30 UTC.
          ts = load.timescale()
          t = ts.utc(2026, 9, 12, 9, 30, 0)
          eph = load('de421.bsp')

          earth = eph['earth']
          targets = {
              'Moon': eph['moon'],
              'Jupiter': eph['jupiter barycenter'],
          }

          print('skyfield_version=1.55')
          print('target_utc=2026-09-12T09:30:00Z')
          print('target_ist=2026-09-12T15:00:00+05:30')
          print('kernel=de421.bsp')
          kernel = Path('de421.bsp')
          print('kernel_sha256=' + sha256(kernel.read_bytes()).hexdigest())

          for name, body in targets.items():
              apparent = earth.at(t).observe(body).apparent()
              lat, lon, distance = apparent.ecliptic_latlon(epoch='date')
              print(f'{name.lower()}_ecliptic_lon_of_date_deg={lon.degrees:.9f}')
              print(f'{name.lower()}_ecliptic_lat_of_date_deg={lat.degrees:.9f}')
              print(f'{name.lower()}_distance_au={distance.au:.12f}')

          eph.close()
          PY
