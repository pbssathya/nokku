name: Wire luminary receipt
on:
  push:
    branches: [exp/lakshmi-numerology-signal]
    paths: [.github/workflows/wire-luminary-receipt.yml]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/lakshmi-numerology-signal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire Sun and lunar phase into preserved transit receipts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nokku/lottery/kerala/living.py')
          s = p.read_text()
          old = '''                "moon": _sidereal_position_payload(receipt.moon),
                "jupiter": _sidereal_position_payload(receipt.jupiter),
'''
          new = '''                "moon": _sidereal_position_payload(receipt.moon),
                "jupiter": _sidereal_position_payload(receipt.jupiter),
                "sun": (
                    _sidereal_position_payload(receipt.sun)
                    if receipt.sun is not None
                    else None
                ),
                "moon_phase_angle_deg": receipt.moon_phase_angle_deg,
'''
          if old not in s:
              raise SystemExit('candidate transit payload anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Fresh install and regression
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          pytest -q
      - name: Commit
        shell: bash
        run: |
          git config user.name "Sathya P B"
          git config user.email "sathya@gooleos.com"
          git add nokku/lottery/kerala/living.py
          git commit -m "feat: preserve Sun and lunar phase evidence"
          git push origin HEAD:exp/lakshmi-numerology-signal
